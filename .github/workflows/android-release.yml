name: Release Android APK

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (z. B. v0.1.2)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release-android:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: android-kotlin

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Build release APK
        run: ./gradlew assembleRelease

      - name: Prepare release artifact
        id: prepare
        run: |
          set -e
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi

          APK_PATH=$(find app/build/outputs/apk/release -maxdepth 1 -type f -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "No APK found in app/build/outputs/apk/release"
            ls -la app/build/outputs/apk/release || true
            exit 1
          fi

          APK_BASENAME=$(basename "$APK_PATH")
          mkdir -p ../release-assets
          cp "$APK_PATH" "../release-assets/zuschnitt-${TAG}-${APK_BASENAME}"

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: List release assets
        run: |
          echo "Uploading APK assets:"
          ls -la release-assets

      - name: Create GitHub release and upload assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.prepare.outputs.tag }}
          files: release-assets/*.apk
          generate_release_notes: true
          body: |
            ## Android APK

            Download the Android app APK for this release.

            - APK: Android application package for installation on compatible devices
            - Install instructions: use the APK file on your Android device or emulator
[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "zuschnitt"
version = "0.1.0"
description = "Local cutting optimizer for sheets and linear stock"
requires-python = ">=3.11"
dependencies = [
    "PySide6>=6.7",
    "reportlab>=4.2",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-qt>=4"]

[project.scripts]
zuschnitt = "zuschnitt.main:main"

[tool.setuptools.packages.find]
where = ["src"]
